name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          $LASTEXITCODE = 0
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Password
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # 1. 关闭系统强密码策略
          net accounts /minpwlen:0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Services\Netlogon\Parameters' -Name "RequireSignOrSeal" -Value 0 -Force
          secedit /export /cfg c:\secpol.cfg
          (Get-Content c:\secpol.cfg).replace("PasswordComplexity = 1", "PasswordComplexity = 0") | Set-Content c:\secpol.cfg
          secedit /configure /db c:\windows\security\local.sdb /cfg c:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item -Force c:\secpol.cfg

          # 2. 用户已存在先删除，避免重复运行报错
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }

          # 3. 生成固定前缀 aa + 6位随机数字的密码
          $password = "aa" + (Get-Random -Minimum 100000 -Maximum 1000000).ToString()

          # 4. 创建用户并加入组
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_CREDS=User: RDP | Password: $password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # 最新版 1.104.7
          $tsVersion = "1.104.7"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$tsVersion-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          if (-not (Test-Path $installerPath) -or (Get-Item $installerPath).Length -lt 1MB) {
            throw "Tailscale 安装包下载失败或文件异常"
          }

          $proc = Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait -PassThru
          if ($proc.ExitCode -notin 0, 3010) {
            throw "Tailscale 安装失败，退出码： $($proc.ExitCode)"
          }
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          & "$env:ProgramFiles\Tailscale\tailscale.exe" version

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --advertise-exit-node

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $rawIP = & $tailscaleExe ip -4 | Select-Object -First 1
            $tsIP = if ($rawIP) { $rawIP.Trim() } else { $null }
            if (-not $tsIP) { Start-Sleep -Seconds 5 }
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
